name: flinx
description: FLINX mobile app for door-control devices.
publish_to: none

version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  asn1lib: ^1.5.5
  dio: ^5.10.0
  flutter:
    sdk: flutter
  flutter_debug_tools: ^2.0.5
  flutter_localizations:
    sdk: flutter
  flutter_platform_alert: ^0.9.1
  flutter_riverpod: ^3.3.1
  flutter_timezone: ^4.1.1
  freezed_annotation: ^3.1.0
  go_router: ^17.2.3
  image_picker: ^1.2.3
  intl: ^0.20.2
  json_annotation: ^4.12.0
  lottie: ^3.5.0
  mobile_scanner: ^7.2.0
  pinput: ^6.0.2
  retrofit: ^4.9.2
  pointycastle: ^4.0.0
  webview_flutter: 4.10.0
  webview_flutter_android: 4.0.0
  webview_flutter_platform_interface: 2.10.0
  webview_flutter_wkwebview: 3.15.0
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^26.1.5
  retrofit_generator: ^10.2.7
  json_serializable: ^6.14.0
  freezed: 3.2.5
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/animations/add_device/
    - assets/images/
    - assets/images/account/
    - assets/icons/
    - assets/icons/auth/
    - assets/icons/add_device/
    - assets/icons/add_device/lottie_js_scan_device/
    - assets/icons/home/
    - assets/icons/device_control/
    - assets/icons/security_center/
